name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de packaging"
        required: false
        default: "onedir"
        type: choice
        options: [onedir, onefile]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller text-fabric pytest

      - name: Run tests
        run: python -m pytest tests/ test_bidi_display.py -q

      - name: Build GUI
        run: pyinstaller analyse_hebreu.spec --noconfirm
        env:
          SPEC_TARGET: gui
          SPEC_MODE: ${{ inputs.mode || 'onedir' }}

      - name: Build CLI
        run: pyinstaller analyse_hebreu.spec --noconfirm
        env:
          SPEC_TARGET: cli
          SPEC_MODE: onedir

      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & dist\analyse_hebreu-cli\analyse_hebreu-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed" }
          & dist\analyse_hebreu-cli\analyse_hebreu-cli.exe --mishna --list-books | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { throw "CLI mishna smoke test failed" }
          # Analyse réelle : la base BHSA embarquée doit être trouvée sans
          # aucune donnée externe (pas de clone à côté, pas de cache).
          & dist\analyse_hebreu-cli\analyse_hebreu-cli.exe "Genèse 1:1" --no-words | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { throw "Embedded BHSA smoke test failed" }

      - name: Smoke test CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/analyse_hebreu-cli/analyse_hebreu-cli
          ./dist/analyse_hebreu-cli/analyse_hebreu-cli --help
          ./dist/analyse_hebreu-cli/analyse_hebreu-cli --mishna --list-books | head -3
          # Analyse réelle : la base BHSA embarquée doit être trouvée sans
          # aucune donnée externe (pas de clone à côté, pas de cache).
          rm -rf ~/text-fabric-data
          ./dist/analyse_hebreu-cli/analyse_hebreu-cli "Genèse 1:1" --no-words | head -3

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p release
          MODE="${{ inputs.mode || 'onedir' }}"
          if [ "$MODE" = "onefile" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              cp dist/analyse_hebreu.exe release/
            else
              cp dist/analyse_hebreu release/
            fi
          else
            if [ "$RUNNER_OS" = "Windows" ]; then
              7z a release/analyse_hebreu-windows.zip dist/analyse_hebreu dist/analyse_hebreu-cli
            else
              tar czf release/analyse_hebreu-linux.tar.gz -C dist analyse_hebreu analyse_hebreu-cli
            fi
          fi
          # Zip post-build produit par le spec (bundle GUI complet avec
          # README.md et gui.properties par defaut) ; spec-file selon le mode.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/analyse_hebreu-$MODE-windows.zip release/ || true
          else
            cp dist/analyse_hebreu-$MODE-linux.zip release/ || true
          fi
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analyse_hebreu-${{ matrix.platform }}-${{ inputs.mode || 'onedir' }}
          path: release/*

      # Publication d'une Release GitHub téléchargeable (sans compte GitHub
      # requis) pour les tags v*. Le zip post-build du bundle GUI (README +
      # gui.properties + exécutable) y est attaché, ainsi que l'archive
      # complète du build pour chaque plateforme.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'onedir' }}"
          # Chaque job de la matrice téléverse ses propres assets sur la
          # Release du tag : le premier à arriver la crée (notes ci-dessous),
          # les autres s'y attachent — aucun conflit entre Windows et Linux.
          if ! gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Version ${GITHUB_REF_NAME#v}" \
              --notes "Analyseur grammatical de l'hébreu biblique — version ${GITHUB_REF_NAME#v}.

              Contenu du zip analyse_hebreu-$MODE-<plateforme>.zip (exécutable GUI complet) :
              - analyse_hebreu(.exe) + ressources embarquées (base BHSA, traductions) ;
              - README.md ;
              - gui.properties (valeurs par défaut, personnalisable).

              Autres fichiers : archive complète du build (GUI + CLI) pour chaque plateforme."
          fi
          gh release upload "${GITHUB_REF_NAME}" release/* \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
