name: Build executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de packaging"
        required: false
        default: "onedir"
        type: choice
        options: [onedir, onefile]
      embed_bhsa:
        description: "Embarquer la base BHSA (~240 Mo) dans l'exécutable"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller text-fabric pytest

      - name: Run tests
        run: python -m pytest tests/ test_bidi_display.py -q

      - name: Clone BHSA data (embedded build)
        if: ${{ inputs.embed_bhsa }}
        run: |
          git clone --branch data2021 --depth 1 --filter=blob:none --sparse https://github.com/ETCBC/bhsa.git bhsa_repo
          cd bhsa_repo && git sparse-checkout set tf/c
          ls tf/c/otype.tf

      - name: Build GUI (onedir)
        if: ${{ inputs.mode != 'onefile' }}
        run: pyinstaller analyse_hebreu.spec --noconfirm
        env:
          SPEC_TARGET: gui
          SPEC_MODE: onedir
          SPEC_BHSA_DIR: ${{ inputs.embed_bhsa && format('{0}/bhsa_repo/tf/c', github.workspace) || '' }}

      - name: Build GUI (onefile)
        if: ${{ inputs.mode == 'onefile' }}
        run: pyinstaller analyse_hebreu.spec --noconfirm
        env:
          SPEC_TARGET: gui
          SPEC_MODE: onefile
          SPEC_BHSA_DIR: ${{ inputs.embed_bhsa && format('{0}/bhsa_repo/tf/c', github.workspace) || '' }}

      - name: Build CLI (onedir)
        run: pyinstaller analyse_hebreu.spec --noconfirm
        env:
          SPEC_TARGET: cli
          SPEC_MODE: onedir
          SPEC_BHSA_DIR: ${{ inputs.embed_bhsa && format('{0}/bhsa_repo/tf/c', github.workspace) || '' }}

      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & dist\analyse_hebreu-cli\analyse_hebreu-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed" }
          & dist\analyse_hebreu-cli\analyse_hebreu-cli.exe --mishna --list-books | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { throw "CLI mishna smoke test failed" }

      - name: Smoke test CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/analyse_hebreu-cli/analyse_hebreu-cli
          ./dist/analyse_hebreu-cli/analyse_hebreu-cli --help
          ./dist/analyse_hebreu-cli/analyse_hebreu-cli --mishna --list-books | head -3

      - name: Smoke test analysis with embedded BHSA (Windows)
        if: ${{ inputs.embed_bhsa && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # Aucune BHSA externe : le binaire doit trouver la base embarquée.
          & dist\analyse_hebreu-cli\analyse_hebreu-cli.exe "Genèse 1:1" --no-words | Select-Object -First 5
          if ($LASTEXITCODE -ne 0) { throw "Embedded BHSA smoke test failed" }

      - name: Smoke test analysis with embedded BHSA (Linux)
        if: ${{ inputs.embed_bhsa && runner.os == 'Linux' }}
        run: |
          # Aucune BHSA externe : le binaire doit trouver la base embarquée.
          rm -rf ~/text-fabric-data
          ./dist/analyse_hebreu-cli/analyse_hebreu-cli "Genèse 1:1" --no-words | head -5

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p release
          MODE="${{ inputs.mode || 'onedir' }}"
          if [ "$MODE" = "onefile" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              cp dist/analyse_hebreu.exe release/
            else
              cp dist/analyse_hebreu release/
            fi
          else
            if [ "$RUNNER_OS" = "Windows" ]; then
              7z a release/analyse_hebreu-windows.zip dist/analyse_hebreu dist/analyse_hebreu-cli
            else
              tar czf release/analyse_hebreu-linux.tar.gz -C dist analyse_hebreu analyse_hebreu-cli
            fi
          fi
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analyse_hebreu-${{ matrix.platform }}-${{ inputs.mode || 'onedir' }}${{ inputs.embed_bhsa && '-bhsa' || '' }}
          path: release/*
