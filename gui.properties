# Propriétés d'affichage de l'interface graphique (gui_hebreu.py).
# Format : clé = valeur, encodage UTF-8.
# Les tailles sont exprimées en points (entiers).

# Police de saisie de l'hébreu (champs Mot et Phrase).
font.input.family = DejaVu Sans
font.input.size = 14

# Police de la zone de résultat (ascenseurs vertical + horizontal).
# DejaVu Sans (proportionnelle) : rend correctement les diacritiques
# hébreux (nikkud, holem), contrairement à la version Mono dont les
# cellules fixes décalent les marques combinantes (ex. le holem de קֹולִי
# apparaissait avant le ק).
font.output.family = DejaVu Sans
font.output.size = 20
